<!DOCTYPE html>
<html lang="es" id="html_torneo">

<head id="head_torneo">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gráfica del Torneo</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- TU CSS -->
    <link rel="stylesheet" href="../CSS/styles.css">
</head>

<body id="body_torneo">

    <!-- HEADER -->
    <header id="header_torneo" class="text-center py-4">
        <h2 id="titulo_torneo">Gráfica del Torneo</h2>
        <p id="subtitulo_torneo">Avance de partidos</p>
    </header>

    <!-- CONTENIDO -->
    <main id="main_torneo" class="container py-4">

        <!-- PARTIDO 1 (PENDIENTE) -->
        <section id="partido_1" class="match-card mb-4">

            <div id="estado_partido_1" class="estado-badge pendiente">
                Pendiente
            </div>

            <div id="equipos_partido_1" class="d-flex justify-content-between align-items-center">

                <div id="equipo1_p1" class="team-box">
                    Lakers Ráfaga
                </div>

                <div id="vs_p1" class="vs-box">VS</div>

                <div id="equipo2_p1" class="team-box">
                    Bulls CDMX
                </div>

            </div>

            <div id="acciones_partido_1" class="mt-3">
                <button id="btn_partido_1" class="btn btn-warning w-100">
                    INICIAR PARTIDO
                </button>
            </div>

        </section>

        <!-- PARTIDO 2 (EN JUEGO) -->
        <section id="partido_2" class="match-card mb-4">

            <div id="estado_partido_2" class="estado-badge en_juego">
                En juego
            </div>

            <div id="equipos_partido_2" class="d-flex justify-content-between align-items-center">

                <div id="equipo1_p2" class="team-box">
                    Warriors Norte
                </div>

                <div id="vs_p2" class="vs-box">VS</div>

                <div id="equipo2_p2" class="team-box">
                    Celtics Sur
                </div>

            </div>

            <div id="acciones_partido_2" class="mt-3">
                <button id="btn_partido_2" class="btn btn-danger w-100">
                    FINALIZAR PARTIDO
                </button>
            </div>

        </section>

        <!-- PARTIDO 3 (FINALIZADO) -->
        <section id="partido_3" class="match-card mb-4">

            <div id="estado_partido_3" class="estado-badge finalizado">
                Finalizado
            </div>

            <div id="equipos_partido_3" class="d-flex justify-content-between align-items-center">

                <div id="equipo1_p3" class="team-box">
                    Halcones
                </div>

                <div id="vs_p3" class="vs-box">VS</div>

                <div id="equipo2_p3" class="team-box">
                    Guerreros
                </div>

            </div>

            <div id="acciones_partido_3" class="mt-3">
                <button id="btn_partido_3" class="btn btn-success w-100">
                    VER ESTADÍSTICAS
                </button>
            </div>

        </section>

    </main>
<!-- NAVBAR APP -->
    <footer id="nav_app" class="d-flex justify-content-around align-items-center">

        <div id="nav_grafica" class="nav-item active">
            GRÁFICA
        </div>

        <div id="nav_stats" class="nav-item">
            ESTADÍSTICAS
        </div>

        <div id="nav_ranking" class="nav-item">
            RANKING
        </div>

    </footer>

</body>
</html>
