<!DOCTYPE html>
<html lang="es" id="html_registro">

<head id="head_registro">
    <meta charset="UTF-8" id="meta_charset_registro">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" id="meta_viewport_registro">
    <title id="title_registro">Registro de Equipos</title>

    <!-- Bootstrap -->
    <link id="bootstrap_css_registro"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- TU CSS -->
    <link id="css_registro" rel="stylesheet" href="../CSS/styles.css">
</head>

<body id="body_registro">

    <!-- HEADER -->
    <header id="header_registro" class="text-center py-4">
        <h2 id="titulo_registro">Registro de Equipos</h2>
    </header>

    <!-- CONTENIDO -->
    <main id="main_registro" class="container py-4">

        <!-- EQUIPO -->
        <section id="seccion_equipo" class="mb-4">
            <div id="card_equipo" class="card p-4">

                <h4 id="titulo_equipo">Datos del equipo</h4>

                <label id="label_nombre_equipo">Nombre del equipo</label>
                <input id="input_nombre_equipo" type="text" class="form-control mb-3">

                <label id="label_origen_equipo">Origen</label>
                <input id="input_origen_equipo" type="text" class="form-control mb-3">

                <button id="btn_agregar_equipo" class="btn btn-warning w-100">
                    Agregar equipo
                </button>

            </div>
        </section>

        <!-- JUGADORES -->
        <section id="seccion_jugador" class="mb-4">
            <div id="card_jugador" class="card p-4">

                <h4 id="titulo_jugador">Agregar jugador</h4>

                <label id="label_nombre_jugador">Nombre</label>
                <input id="input_nombre_jugador" type="text" class="form-control mb-3">

                <div id="fila_jugador" class="row">

                    <div id="col_dorsal" class="col-4">
                        <label id="label_dorsal">Dorsal</label>
                        <input id="input_dorsal" type="number" class="form-control">
                    </div>

                    <div id="col_posicion" class="col-8">
                        <label id="label_posicion">Posición</label>
                        <select id="select_posicion" class="form-control">
                            <option>Base</option>
                            <option>Escolta</option>
                            <option>Alero</option>
                            <option>Ala-Pívot</option>
                            <option>Pívot</option>
                        </select>
                    </div>

                </div>

                <button id="btn_agregar_jugador" class="btn btn-warning mt-3 w-100">
                    Agregar jugador
                </button>

            </div>
        </section>

        <!-- LISTA JUGADORES -->
        <section id="seccion_lista_jugadores" class="mb-4">
            <div id="card_lista_jugadores" class="card p-4">

                <h4 id="titulo_lista_jugadores">Jugadores</h4>

                <ul id="lista_jugadores" class="list-group">
                    <li id="jugador_1" class="list-group-item">
                        Carlos Jiménez - #10
                    </li>
                    <li id="jugador_2" class="list-group-item">
                        Luis Ortega - #23
                    </li>
                </ul>

            </div>
        </section>

        <!-- LISTA EQUIPOS -->
        <section id="seccion_lista_equipos" class="mb-4">
            <div id="card_lista_equipos" class="card p-4">

                <h4 id="titulo_lista_equipos">Equipos registrados</h4>

                <ul id="lista_equipos" class="list-group">
                    <li id="equipo_1" class="list-group-item">
                        Chicomesuchil - San Juan Chicomesuchil
                    </li>
                    <li id="equipo_2" class="list-group-item">
                        Chak´s - Ixtlan de Juarez
                    </li>
                </ul>

            </div>
        </section>

        <!-- BOTONES -->
        <section id="seccion_botones" class="d-flex gap-2">

            <button id="btn_cancelar" class="btn btn-outline-light w-50">
                Cancelar
            </button>

            <button id="btn_continuar_registro" class="btn btn-warning w-50">
                Continuar
            </button>

        </section>

    </main>

</body>
</html>
