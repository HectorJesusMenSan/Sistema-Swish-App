<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partido en Vivo</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- TU CSS -->
    <link rel="stylesheet" href="../CSS/base.css">
    <link rel="stylesheet" href="../CSS/components.css">
    <link rel="stylesheet" href="../CSS/layout.css">
    <link rel="stylesheet" href="../CSS/capturaDatos.css">

    <!-- Fuente -->
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>

<body>

    <!-- HEADER -->
    <div id="header_partido" class="p-3 text-center position-sticky top-0">
        <h3 id="marcador" class="fw-bold m-0">45 - 42</h3>
        <small id="equipos">Equipo A vs Equipo B</small>
        <div id="ronda" class="position-absolute end-0 top-0 p-3 fw-bold">
            Ronda 3
        </div>
    </div>

    <!-- SELECTOR -->
    <div class="container py-3">
        <div id="pestaña" class="d-flex bg-dark rounded-pill p-1">
            <button class="btn equipo-activo w-50 rounded-pill fw-bold">Equipo A</button>
            <button class="btn equipo-inactivo w-50 fw-bold">Equipo B</button>
        </div>
    </div>

    <!-- JUGADORES -->
    <div class="container pb-5">

        <div class="card jugador-card mb-3">

            <div class="d-flex justify-content-between">

                <div class="d-flex align-items-center gap-3">
                    <div class="numero-jugador">10</div>

                    <div>
                        <div class="fw-bold">Juan Pérez</div>
                        <small class="text-secondary">Ciudad de México</small>
                    </div>
                </div>

                <div class="text-end">
                    <div class="puntos">12 PTS</div>
                    <small class="faltas">Faltas: 3</small>
                </div>

            </div>

            <div class="d-flex gap-2 mt-3">
                <button class="btn btn-accion w-100">+1 pts</button>
                <button class="btn btn-accion w-100">+2 pts</button>
                <button class="btn btn-accion w-100">+3 pts</button>
                <button class="btn btn-falta w-100">Falta</button>
            </div>
        </div>

        <!-- ALERTA -->
        <div class="card jugador-card peligro mb-3">

            <div class="d-flex justify-content-between">

                <div class="d-flex align-items-center gap-3">
                    <div class="numero-jugador peligro">05</div>

                    <div>
                        <div class="fw-bold">Carlos Ruiz</div>
                        <small class="text-secondary">Guadalajara</small>
                    </div>
                </div>

                <div class="text-end">
                    <div class="puntos">8 PTS</div>
                    <small class="faltas peligro">Faltas: 4</small>
                </div>

            </div>

            <div class="d-flex gap-2 mt-3 deshabilitado">
                <button class="btn btn-accion w-100">+1 pts</button>
                <button class="btn btn-accion w-100">+2 pts</button>
                <button class="btn btn-accion w-100">+3 pts</button>
                <button class="btn btn-falta w-100 peligro">Falta</button>
            </div>
        </div>

    </div>

    <!-- FOOTER -->
    <div id="footer_partido" class="position-fixed bottom-0 w-100 p-3">
        <div class="container d-flex gap-3">

            <button class="btn btn-secundario">↺</button>

            <button class="btn btn-main w-100 fw-bold">
                Finalizar Partido
            </button>

        </div>
    </div>

</body>
</html>
