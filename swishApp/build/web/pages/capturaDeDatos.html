<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title id="titulo_estadisticas">Estadísticas del partido</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- TU CSS -->
    <link rel="stylesheet" href="../CSS/styles.css">
</head>

<body id="cuerpo_estadisticas">

<header id="header_estadisticas" class="p-3">

    <div id="barra_superior" class="d-flex justify-content-between align-items-center">

        <div id="btn_regresar">
            ←
        </div>

        <div id="contenedor_marcador" class="text-center">
            <h2 id="marcador_principal">45 - 42</h2>
            <p id="titulo_equipos">Equipo A vs Equipo B</p>
        </div>

        <div id="contenedor_ronda">
            <span id="texto_ronda">RONDA 3</span>
        </div>

    </div>

</header>

<main id="principal_estadisticas" class="container py-3">

    <!-- TABS EQUIPOS -->
    <ul class="nav nav-tabs mb-3">
        <li class="nav-item">
            <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#equipoA">
                Equipo A
            </button>
        </li>
        <li class="nav-item">
            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#equipoB">
                Equipo B
            </button>
        </li>
    </ul>

    <div class="tab-content">

        <!-- =========================
             🔹 EQUIPO A
             ========================= -->
        <div class="tab-pane fade show active" id="equipoA">

            <!-- JUGADOR 1 -->
            <section id="jugador_1" class="tarjeta-jugador mb-3">

                <div class="d-flex justify-content-between">

                    <div class="d-flex align-items-center">

                        <div class="numero-jugador">10</div>

                        <div>
                            <p class="nombre-jugador">Juan Pérez</p>
                            <span class="ciudad-jugador">Ciudad de México</span>
                        </div>

                    </div>

                    <div class="text-end">
                        <p id="puntos_jugador_1" class="puntos-jugador">12 PTS</p>
                        <span id="faltas_jugador_1" class="faltas-jugador">Faltas: 3</span>
                    </div>

                </div>

                <div class="d-flex gap-2 mt-3">
                    <button id="btn_2pts_1" class="btn-accion">+2 pts</button>
                    <button id="btn_3pts_1" class="btn-accion">+3 pts</button>
                    <button id="btn_falta_1" class="btn-falta">Falta</button>
                </div>

            </section>

        </div>

        <!-- =========================
             🔹 EQUIPO B
             ========================= -->
        <div class="tab-pane fade" id="equipoB">

            <!-- JUGADOR 2 -->
            <section id="jugador_2" class="tarjeta-jugador peligro mb-3">

                <div class="d-flex justify-content-between">

                    <div class="d-flex align-items-center">

                        <div class="numero-jugador peligro">05</div>

                        <div>
                            <p class="nombre-jugador">Carlos Ruiz</p>
                            <span class="ciudad-jugador">Guadalajara</span>
                        </div>

                    </div>

                    <div class="text-end">
                        <p id="puntos_jugador_2" class="puntos-jugador">8 PTS</p>
                        <span id="faltas_jugador_2" class="faltas-jugador peligro">Faltas: 4</span>
                    </div>

                </div>

                <div class="d-flex gap-2 mt-3">
                    <button id="btn_2pts_2" class="btn-accion deshabilitado">+2 pts</button>
                    <button id="btn_3pts_2" class="btn-accion deshabilitado">+3 pts</button>
                    <button id="btn_falta_2" class="btn-falta peligro">Falta</button>
                </div>

            </section>

        </div>

    </div>

</main>

<footer id="footer_estadisticas" class="p-3">

    <div id="contenedor_footer" class="d-flex gap-3">

        <button id="btn_deshacer" class="btn-secundario">⟲</button>

        <button id="btn_finalizar" class="btn-main w-100">
            FINALIZAR PARTIDO
        </button>

    </div>

</footer>

<!-- SCRIPT BOOTSTRAP (NECESARIO PARA TABS) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
